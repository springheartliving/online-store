name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # 也可以手動從 Actions tab 觸發
  workflow_dispatch:

# 給 GitHub Pages 部署所需的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只允許一個部署，不取消進行中的任務
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: true
          VITE_LINE_ID: ${{ vars.VITE_LINE_ID }}
          VITE_LINE_URL: ${{ vars.VITE_LINE_URL }}
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_LIFF_URL: ${{ vars.VITE_LIFF_URL }}
          VITE_GOOGLE_SHEETS_WEB_APP_URL: ${{ vars.VITE_GOOGLE_SHEETS_WEB_APP_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
